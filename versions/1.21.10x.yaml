decisions:
  support_scope: "Only stable Minecraft 1.21.100 through 1.21.102 under protocol 827; previews and every other 1.21.x family remain unsupported."
  conversion_direction: "Each accepted target converts directly to and from native protocol 2169."
  patch_selection: "One protocol-827 adapter; the locked sources show no patch-internal wire split. Unknown protocol-827 GameVersion values are rejected from the supported-version policy."
  modding_required: false
  modding_reason: "Exact historical gophertunnel and Dragonfly sources, Mojang protocol documentation, and BDS metadata are available."
  enable_in_protocol_catalog: true
  enable_reason: "ProtocolsWithRegistries validates protocol-827 block/item mappings before advertisement; parameterless Protocols remains registry-free."
  block_fallback_policy: "Map native-only states to protocol-827 minecraft:air; all 2,214 fallbacks are recorded in data/v827/fallbacks.json."
  item_fallback_policy: "Hide 213 native-only items clientbound and reject unknown target items serverbound; historical aliases, including minecraft:item.chain to minecraft:iron_chain, are resolved semantically while their wire registry names remain unchanged."
