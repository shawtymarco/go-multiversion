decisions:
  support_scope: "Stable 1.26.20, 1.26.21, and 1.26.23 releases listed above, all under protocol 975."
  conversion_direction: "Each target release converts directly to and from native protocol 2169."
  modding_required: false
  modding_reason: "Exact historical gophertunnel and Dragonfly sources plus Mojang and Endstone protocol documentation are available."
  enable_in_protocol_catalog: false
  enable_reason: "The parameterless catalog cannot safely construct registry mappings. ProtocolsWithRegistries enables protocol 975 after steps 1-5 pass."
  block_fallback_policy: "Map native-only states to protocol-975 minecraft:air; every fallback is recorded in data/v975/fallbacks.json."
  item_fallback_policy: "Hide native-only items clientbound and reject unknown target items serverbound; every native fallback is recorded."

