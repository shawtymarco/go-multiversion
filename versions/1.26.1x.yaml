decisions:
  support_scope: "Stable 1.26.10 through 1.26.14 releases listed above, all under protocol 944."
  conversion_direction: "Protocol 944 converts directly to and from native protocol 2169; copied protocol-975 code is only a verified implementation baseline, not a semantic hop."
  modding_required: false
  modding_reason: "Exact historical gophertunnel and Dragonfly sources plus Mojang and Endstone protocol documentation are available."
  enable_in_protocol_catalog: false
  enable_reason: "ProtocolsWithRegistries validates protocol-944 block/item mappings before advertisement; parameterless Protocols remains registry-free."
  block_fallback_policy: "Map native-only states to the verified protocol-944 minecraft:air runtime ID 12531."
  item_fallback_policy: "Hide native-only items clientbound and reject unknown target items serverbound."
  target_only_item_policy: "Advertise editor:map_marker_spawn_egg at target runtime ID 843 for registry fidelity and reject it serverbound because native has no semantic equivalent."
  real_client_status: "Required before declaring the family fully validated."
