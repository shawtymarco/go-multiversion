  enable_reason: "Wire/data/mapping/chunk gates and the automated deployment matrix pass; real-client evidence remains pending."
  block_fallback_policy: "Map native-only states to protocol-486 minecraft:air and record every fallback."
  item_fallback_policy: "Hide native-only items clientbound and reject unknown target items serverbound."

