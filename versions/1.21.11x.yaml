decisions:
  support_scope: "Only stable Minecraft 1.21.110 through 1.21.114 under protocol 844; 1.21.120 and every other 1.21.x family remain unsupported."
  conversion_direction: "Each accepted target converts directly to and from native protocol 2169."
  patch_selection: "One protocol-844 adapter; the locked historical sources show no patch-internal wire split in 1.21.11x. Unknown protocol-844 GameVersion values are rejected from the supported-version policy."
  modding_required: false
  modding_reason: "Exact historical gophertunnel and Dragonfly sources, Mojang protocol documentation, and BDS metadata are available."
  enable_in_protocol_catalog: false
  enable_reason: "Enable only after steps 2-5 and registry-aware construction pass."
  block_fallback_policy: "Pending step 4 mapping audit."
  item_fallback_policy: "Pending step 4 mapping audit."
